[workspace]
members = ['crates/*']
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
description = "Cross-platform windows dll loader"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace.dependencies]
champagne-macros = { path = "./crates/champagne-macros", version = "0.1.1" }
champagne-kernel = { path = "./crates/champagne-kernel", version = "0.1.1" }
champagne-loader = { path = "./crates/champagne-loader", version = "0.1.1" }

cranelift = "0.100.0"
cranelift-codegen = "0.100.0"
cranelift-jit = "0.100.0"
cranelift-module = "0.100.0"
cranelift-native = "0.100.0"
derivative = "2.2.0"
inventory = "0.3"
time = "0.3"
dynasm = "2.0.0"
libc = "0.2.148"
memmap2 = "0.8.0"
moveit = "0.5.1"
nix = { version = "0.27.1", features = ["mman", "fs", "signal"] }
nt-list = "0.2.0"
nt-string = "0.1.1"
parking_lot = "0.12.1"
pelite = { git = "https://github.com/CasualX/pelite" }
pin-project = "1.1.3"
region = "3.0.0"
tracing = "0.1.37"
widestring = "1.0.2"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
digest = "0.10"
der-parser = "10.0.0"
rand = "0.9"
thiserror = "2.0.20"
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = "3.0.6"
